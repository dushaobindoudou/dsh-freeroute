name: Publish to npm

# Publish on version tags (vX.Y.Z). Requires the `NPM_TOKEN` repository secret
# (an npmjs automation token with publish scope). Provenance is generated via
# GitHub OIDC + Sigstore when the build is triggered by a version tag on the
# default branch of a public repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Mirror the changelog section of the released version into a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Literal substring match — index(), not a regex: version brackets
          # like "## [1.0.2]" would otherwise parse as a character class.
          awk -v ver="## [$TAG]" '
            index($0, ver) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for version $TAG" >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "dsh-freeroute ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
